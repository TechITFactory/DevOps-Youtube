apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-green
spec:
  replicas: 2
  selector:
    matchLabels: {app: shop, color: green}
  template:
    metadata:
      labels: {app: shop, color: green}
    spec:
      containers:
      - name: web
        image: nginx:1.28-alpine
        readinessProbe:
          httpGet: {path: /, port: 80}
        volumeMounts:
        - {name: page, mountPath: /usr/share/nginx/html}
      volumes:
      - name: page
        configMap: {name: page-green}
